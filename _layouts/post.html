---
layout: default
---
<div class="post">
  <h1 class="post-title">{{ page.title }}</h1>
  <span class="post-date">{{ page.date | date_to_string }}</span>
  {% if page.tags.size > 0 %}
  <div class="tags">
    <strong>Tags:</strong>
    {% for tag in page.tags %}
      <a href="/tags/#{{ tag | slugify }}">{{ tag }}</a>
    {% endfor %}
  </div>
  {% endif %}
  {{ content }}
  {% if page.comments %}
    {% include giscus.html %}
  {% endif %}
</div>
