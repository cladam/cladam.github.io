name: Build and Deploy Jekyll Site

on:
  push:
    branches:
      - main
    paths:
      - '_config.yml'
      - '_includes/**'
      - '_layouts/**'
      - '_plugins/**'
      - '_posts/**'
      - '_projects/**'
      - 'assets/**'
      - 'docs/**'
      - 'index.html'
      - 'about.md'
      - 'tags.md'
      - 'Gemfile'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build with Jekyll
        run: JEKYLL_ENV=production bundle exec jekyll build --verbose
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
